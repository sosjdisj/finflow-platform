# FinFlow CI（S41）：后端/假渠道测试 + 前端构建测试 + 三个镜像可构建性校验
# 说明：镜像只做 build 校验、不推送 registry（无 registry 凭据依赖）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  java-test:
    name: Java 构建与测试 (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [finflow-backend, finflow-fake-channel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      # 复用根目录 docker-compose.yml 起 Redis/Kafka（与本地开发同一份编排）
      - name: 启动中间件（Redis + Kafka）
        run: docker compose up -d --wait redis kafka

      - name: 编译 + 单测（MySQL 由 Testcontainers 提供）
        working-directory: ${{ matrix.module }}
        run: mvn -B -ntp test

  frontend-test:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: finflow-frontend/package-lock.json

      - name: 安装依赖
        working-directory: finflow-frontend
        run: npm ci

      - name: 单元测试
        working-directory: finflow-frontend
        run: npm run test:unit -- --run

      - name: 构建（含 vue-tsc 类型检查）
        working-directory: finflow-frontend
        run: npm run build

  docker-build:
    name: 镜像构建校验 (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [java-test, frontend-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            file: finflow-backend/Dockerfile
            image: finflow-backend
          - context: .
            file: finflow-fake-channel/Dockerfile
            image: finflow-fake-channel
          - context: ./finflow-frontend
            file: ./finflow-frontend/Dockerfile
            image: finflow-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
