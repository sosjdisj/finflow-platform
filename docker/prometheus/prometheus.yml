# S40：Prometheus 抓取配置
# 应用在本机 8080 运行，容器内经 host.docker.internal 访问；S41 应用容器化后把 target 换成 compose 服务名
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: finflow-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
