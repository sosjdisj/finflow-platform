# 测试环境：单测不依赖真实中间件（S39 引入 Testcontainers 后替换为真实 MySQL）
spring:
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  cloud:
    # M08：单测不起注册中心与 Sentinel，避免测试期向 Nacos 注册、占用 Sentinel 传输端口
    nacos:
      discovery:
        enabled: false
    sentinel:
      enabled: false
