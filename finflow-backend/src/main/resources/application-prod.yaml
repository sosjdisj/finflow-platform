# prod：敏感配置一律走环境变量，禁止硬编码
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  # M14 配置中心导入：写在 prod 文档里，此时上面的 enabled=true 已生效（非 profile 阶段还读不到）
  config:
    import:
      - optional:nacos:finflow-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  # M08 生产为多进程部署：backend 与渠道服务都注册到 Nacos（compose 服务名 nacos）
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      # M14 配置中心：生产强制开启，namespace 按环境隔离
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${FINFLOW_NACOS_NAMESPACE:}
        group: ${FINFLOW_NACOS_GROUP:FINFLOW_GROUP}
    sentinel:
      transport:
        # Sentinel 控制台地址由环境变量注入；留空则不上报
        dashboard: ${SENTINEL_DASHBOARD:}
finflow:
  auth:
    jwt:
      # 生产无默认值：未配置环境变量则启动即失败，避免误用开发密钥
      secret: ${FINFLOW_JWT_SECRET}

# S40：生产环境不暴露 API 文档与调试 UI
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
