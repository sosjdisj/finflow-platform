# dev：MySQL 用本机已有实例；Redis/Kafka 由 docker-compose 提供
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 2369
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

# 渠道对接：指向本地假渠道模拟器（独立进程，端口 8090），密钥须与渠道服务一致
finflow:
  remote-channel:
    base-url: http://localhost:8090
    secret: finflow-fake-channel-secret
